compliance_program:
  published: false
  certifications: []
  evidence: >-
    https://www.propertyme.com.au/security documents encryption in transit and at rest, two-factor
    authentication, session lockout and activity logging, but names no certification — no SOC 2, no
    ISO 27001, no PCI DSS, no penetration-test attestation, and no trust centre. trust.propertyme.com
    and trust.propertyme.com.au do not resolve. PropertyMe's parent MePay Holdings Pty Ltd does hold
    AFS licence no. 528836 and AFCA membership 81095 for its payments product, which is financial
    licensing rather than an information-security certification.
