supplemental_source: https://login.propertyme.com/.well-known/openid-configuration
notes: >-
  PropertyMe conforms strongly on the identity side and weakly on the API side. The identity provider
  implements a broad slice of the OAuth 2.x / OIDC RFC family — discovery, PKCE, PAR, device code,
  CIBA, revocation, introspection, dynamic client registration, DPoP algorithms. The API itself is a
  plain Swagger 2.0 CRUD surface: no RFC 9457 problem details, no conditional requests, no Sunset
  headers, no idempotency contract, no RFC 9116 security.txt, no RFC 9727 api-catalog. RESO — the
  North American real estate data standard — is absent and expected to be: PropertyMe does not appear
  in the RESO certification directory, there is no OData service, no $metadata document and no
  Universal Property Identifier, because RESO is an NAR/MLS construct with no Australian counterpart
  and PropertyMe sits on the property-management rail rather than the listings rail.
