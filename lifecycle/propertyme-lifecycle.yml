notes: >-
  PropertyMe versions in the URI path and runs v1 and v2 side by side today: the job-task (maintenance
  work order) resource is the only one with a v2 shape, and both generations are live in the same
  contract with neither marked deprecated. That is the whole of the published versioning story — there
  is no versioning policy page, no deprecation policy, no Sunset or Deprecation header, no changelog
  or release-notes feed for the API, no roadmap, and no published SLA or uptime target. The one
  operational commitment PropertyMe does publish is an Atlassian Statuspage, which exposes a machine-
  readable summary API and has recorded 100% uptime on both monitored components over the trailing 90
  days.
