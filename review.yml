- url: https://www.reso.org/certificates/
  status: 200
  note: 416,233 bytes. Zero matches for "propertyme"; zero matches for
    "australia".

webhooksEventsSdksPostman:
  webhooks: |
    None. Zero occurrences of "webhook" in the 266KB contract, no subscription
    or callback endpoint, no signing key surface, and no webhook documentation
    anywhere on the site. Integrations poll instead: nearly every collection
    endpoint takes a TimeStamp parameter and returns records changed since it,
    and the contacts endpoint documents that a timestamp older than one month
    returns everything. Polling-by-timestamp is the integration pattern here,
    and its absence of events is a real limitation for the maintenance and
    inspection workflows that third parties build on.
  events: |
    No AsyncAPI, no event bus, no WebSocket surface, no server-sent events, no
    streaming. The contract is HTTPS request/response only, schemes ["https"].
  mcp: |
    No MCP server, no tool list, no MCP documentation. The only MCP-shaped
    signal in the entire public surface is the non-standard grant type
    "mcp_customer_switch" advertised in the OIDC discovery document, recorded
    verbatim above and deliberately not interpreted.
  sdks: |
    No first-party SDK on npm, NuGet or PyPI was found under a PropertyMe
    namespace. The only first-party code is the HelloPropertyMe.NET sample. A
    third-party Python wrapper, PyPropertyMe (pypropertyme.garyj.dev), exists and
    is explicit that it supports GET endpoints only.
  postman: No official Postman collection or workspace found.
  graphql: None. No GraphQL endpoint documented or discovered.
  changelog: |
    No developer-facing changelog or API release notes. The company publishes
    product release content through https://www.propertyme.com.au/the-loop and
    the blog, not a versioned API changelog.
  statusPage: Yes — https://status.propertyme.com/ (HTTP 200).
  rateLimits: |
    None published. No rate limit documentation on the site and no rate-limit
    headers or 429 responses described in the contract.
  sandbox: |
    None found. No sandbox host, no demo portfolio, no test credentials. Every
    documented call acts on a live customer portfolio.
  deprecationPolicy: |
    None published. Versioning is path-based and visible in the contract — job
    tasks exist at both /v1/jobtasks and /v2/jobtasks with v1 still present —
    but no deprecation policy, sunset header or migration guide is documented.
  versioning: Path-based, /v1 and /v2, with both live simultaneously for job tasks.

findings:
- The headline is an inversion of this sector's central tension. Everywhere RESO
  mandates a contract, the contract is served only to licensed members. Here
  there is no mandate at all, and the contract is served to anyone — 266KB of
  Swagger 2.0 at a stable, anonymous URL — while the credentials are handed out
  by a human. Openness of the spec and openness of access are genuinely
  independent variables, and PropertyMe is the clean proof.
- RESO is absent and that is correct, not a gap. Australia has no MLS and no NAR.
  The RESO certification directory contains zero Australian organisations of any
  kind. The market's mandated machine-readable rail is PEXA electronic
  conveyancing, which is a settlement rail; a property management vendor sits
  nowhere near it.
- The identity server advertises eleven more scopes than the published contract
  ever names, including ids:admin, customer:write, tenancy:write, form:write and
  org-portal:api. The public Swagger document is therefore a subset view of a
  larger internal surface, and the size of that gap is itself the finding.
- Two non-standard OAuth grant types are advertised — mcp_customer_switch and
  on_behalf_of. The first is the only MCP-shaped artifact in PropertyMe's entire
  public surface, and it lives in the identity layer with no corresponding
  server, tool or documentation.
- Absence is a finding — no webhooks, no events, no AsyncAPI, no GraphQL, no
  sandbox, no rate limits, no deprecation policy, no changelog, no Postman
  workspace, no first-party SDK, no llms.txt, no security.txt, no open data, and
  no API terms document (the one at /apiterms has been withdrawn to a redirect).
- The integration ecosystem is real but invisible from the developer's side. The
  integrations page lists dozens of live partner products and never once uses the
  word "API"; the partner directory is entirely services firms. A developer
  arriving at propertyme.com.au has no path to the API at all — the spec is only
  reachable if you already know the app host.
- Where the API is deep, it is deep in the places listing-oriented real estate
  APIs are empty — twenty inspection operations with a full state machine,
  twenty-five job-task operations with supplier quotations, and tenancy
  balances. Where
  it is thin is money — a single POST /v1/bills against a trust-accounting
  platform whose operator holds an AFS licence and runs its own payments product.
- The consent model is explicit and revocable. Every token is bound to one
  connected portfolio and DELETE /v1/portfolios/disconnect severs it, which makes
  this per-customer integration rather than market-wide data access — the same
  shape as an MLS-gated feed, arrived at by a completely different route.

