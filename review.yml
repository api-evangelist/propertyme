aid: propertyme
name: PropertyMe
review:
  question: What is PropertyMe's real, publicly reachable API surface, what does a
    developer have to sign or join to use it, and what is its RESO posture?
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Australia
  secondaryMarket: New Zealand
  tier: property-management
  primaryDomain: propertyme.com.au
  summary: |
    PropertyMe inverts the pattern seen everywhere else in this sector. In the
    United States the contract is mandated by RESO and the endpoint is locked
    behind an MLS agreement. At PropertyMe the CONTRACT IS OPEN and the
    CREDENTIALS are closed. A complete Swagger 2.0 document — 75 paths, 86
    operations, 296 definitions, 266,274 bytes — is served to an anonymous
    client with no login, no token and no referer at
    https://app.propertyme.com/api/openapi.json, and rendered by a public
    Swagger UI titled "PropertyMe APIs" at
    https://app.propertyme.com/api/swagger-ui/. The OpenID Connect discovery
    document at https://login.propertyme.com/.well-known/openid-configuration is
    likewise served anonymously and enumerates the entire scope catalogue. Both
    were harvested verbatim.

    What is NOT public is the way in. There is no developer signup, no app
    registration route, no client-credential self-issuance page and no published
    partner API application form anywhere on propertyme.com.au or
    app.propertyme.com. Every developer/developers/docs/api subdomain on both
    propertyme.com and propertyme.com.au fails DNS resolution. The only
    first-party developer artifact outside the spec is a sample .NET OAuth app
    the company publishes at github.com/PropertyMe/HelloPropertyMe.NET, whose
    appsettings.json hard-codes the two real hosts and whose HomeController
    hard-codes a real authorize URL and scope string. A developer therefore has
    to approach PropertyMe and be issued a client_id and client_secret by a
    human — application-approval — and then each individual agency customer must
    connect their own portfolio, which they can sever at any time through
    DELETE /v1/portfolios/disconnect.

    RESO does not appear anywhere. That is the correct Australian answer.
    Australia has no MLS and no NAR, so there is nothing to certify against; the
    closest thing to a mandated national machine-readable property rail here is
    PEXA electronic conveyancing, and PropertyMe is a property management system
    that sits nowhere near settlement.

resoPosture:
  certified: false
  posture: No RESO reference found anywhere in PropertyMe's OpenAPI, OpenID Connect
    discovery document, corporate site or public GitHub organisation; RESO is a
    North American NAR/MLS construct and Australia has no MLS to certify against.
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  directoryEvidence: |
    https://www.reso.org/certificates/ was fetched anonymously on 2026-07-26
    (HTTP 200, 416,233 bytes). A case-insensitive search for "propertyme"
    returned zero matches, and a case-insensitive search for "australia"
    returned zero matches — no Australian organisation of any kind appears in
    the RESO certification directory.
  odataEndpoint: none
  metadataDocument: |
    Probed https://app.propertyme.com/$metadata (HTTP 404, 2,463 bytes of HTML)
    and https://app.propertyme.com/api/v1/$metadata (HTTP 404, 0 bytes). No
    OData service document or $metadata exists. A case-insensitive grep for
    "odata" across the harvested 266KB Swagger document returned zero hits. The
    API is a plain JSON REST surface described by Swagger 2.0, not OData.
  universalPropertyIdentifier: |
    No UPI. Identifiers in the contract are opaque per-portfolio GUIDs — lot Id,
    contact Id, tenancy Id, inspection Id, job task Id — unique only inside the
    one customer portfolio the token is connected to. There is no global,
    cross-tenant property identifier and no parcel or title reference exposed.
  idxVowLicence: |
    Not applicable. IDX and VOW are US MLS display-licence constructs. PropertyMe
    is not a listing syndication product; it manages the rent roll, not the
    shopfront.
  wordBoundaryGrep: |
    Case-insensitive grep for reso, odata, "universal property identifier", upi,
    webhook and subscription across openapi/propertyme-openapi.json returned:
    zero for reso as a word (the single case-insensitive "resO" hit is the
    substring inside "CustomerSupportExpiresOn"), zero for odata, zero for UPI,
    zero for webhook, and thirteen hits for "Subscription" which are all
    product-subscription models (GetProductSubscriptionsRequest,
    ProductSubscriptionsResponse, ProductSubscriptionDto, SubscriptionStatus),
    not event subscriptions.
  marketNote: |
    Australia is a portal duopoly — REA Group's realestate.com.au and Domain —
    sitting over progressively privatised state land registries plus PEXA, which
    settles the overwhelming majority of Australian property transactions and is
    effectively mandated in most states. PEXA, not RESO, is this market's
    required machine-readable rail, and it is a settlement rail rather than a
    listing rail. Valuation is concentrated in PropTrack (REA-owned) and
    CoreLogic. PropertyMe touches none of those four surfaces: it is the system
    of record for the rental portfolio, one layer below the portals and one
    layer away from settlement. The consequence is that the richest structured
    tenancy, inspection and maintenance data in Australian residential real
    estate lives in a property management vendor's per-tenant database, described
    by an open Swagger document that nobody can call without being let in.

accessGate:
  gate: application-approval
  gated: true
  selfServe: false
  gateNuance: |
    Three things must be held apart. The DOCUMENTATION gate is open: the Swagger
    UI and the raw Swagger JSON are anonymous, and so is the OIDC discovery
    document. The CREDENTIAL gate is application-approval: no route exists to
    self-issue an OAuth client, so a client_id and client_secret must be issued
    to you by PropertyMe. The DATA gate is customer consent: even holding valid
    credentials, no agency data is reachable until that agency connects its
    portfolio, and the connection is revocable by
    DELETE /v1/portfolios/disconnect. Classified application-approval because
    that is the first gate a developer cannot pass unaided.
  whatYouMustSignOrJoin: |
    You do not have to join an MLS, a board, an association, or hold a real
    estate licence — none of those constructs gate software integration in
    Australia. You must obtain OAuth client credentials from PropertyMe, which
    in practice means an integration/partner conversation with the company; the
    marketing site routes all commercial contact through
    https://www.propertyme.com.au/contact and https://www.propertyme.com.au/request-a-demo,
    and lists finished integrations on https://www.propertyme.com.au/integrations
    and services partners on https://www.propertyme.com.au/partner-directory.
    Neither page publishes an API application form or developer terms. A page at
    https://www.propertyme.com.au/apiterms was indexed by search engines but now
    HTTP 302s to the homepage, so no API-specific terms document is currently
    published; the general Terms at https://www.propertyme.com.au/terms were
    fetched (HTTP 200, 134,594 bytes) and contain zero occurrences of the word
    "API".
  credentialIssuance: |
    Human-issued. No /register, /signup, /apps, /developers or /integrations
    route exists on app.propertyme.com — all probed and all HTTP 404. The
    company's own sample application (github.com/PropertyMe/HelloPropertyMe.NET)
    presents ClientId and ClientSecret as values the developer already possesses
    and types into a form; it never explains where they come from, which is the
    tell that they are handed out rather than self-served.
  productionAccess: |
    A PropertyMe customer (the agency) authorises the integration through the
    authorization code flow at https://login.propertyme.com/connect/authorize,
    granting the scopes the client requests, and thereby connects one portfolio.
    All subsequent calls act on that portfolio. The customer or the integration
    can sever it with DELETE /v1/portfolios/disconnect.
  commercialContact: https://www.propertyme.com.au/contact
  partnerProgram: https://www.propertyme.com.au/integrations
  docsAreOpen: |
    Genuinely open, and this is the finding. Anonymous, unauthenticated GET of
    https://app.propertyme.com/api/openapi.json returns the complete contract.
    In a sector where the mandated-contract markets serve their specs only to
    licensed members, an Australian property management vendor with no mandate
    at all publishes its spec to the open internet.

openData:
  publishesOpenData: false
  note: |
    PropertyMe publishes no open, unlicensed, publicly callable dataset. Every
    record behind the API is one agency customer's private rent roll — owners,
    tenants, tenancy balances, trust bills, inspection reports — and it is
    reachable only with that customer's granted consent. Australia's genuinely
    open property data sits elsewhere and in government hands: state land
    registry and valuer-general releases, the ABS, and data.gov.au. None of it
    is operated by PropertyMe, and PropertyMe does not republish any of it.

authModel:
  scheme: OAuth 2.0 / OpenID Connect, bearer tokens on the API
  identityProvider: |
    Self-hosted IdentityServer (Duende/IdentityServer4 lineage). The company's
    GitHub organisation contains forks of IdentityServer4 and of
    servicestack-authentication-identityserver, and the discovery document's
    endpoint layout (/connect/authorize, /connect/token, /connect/userinfo,
    /connect/checksession, /connect/endsession, /connect/revocation,
    /connect/introspect, /connect/deviceauthorization, /connect/ciba,
    /connect/par) is the IdentityServer signature.
  discoveryDocument: |
    https://login.propertyme.com/.well-known/openid-configuration — fetched
    anonymously 2026-07-26, HTTP 200, application/json, 3,255 bytes, parses.
    Saved verbatim to authentication/propertyme-openid-configuration.json.
    The JWKS at
    https://login.propertyme.com/.well-known/openid-configuration/jwks also
    returned HTTP 200.
  issuer: https://login.propertyme.com
  authorizationEndpoint: https://login.propertyme.com/connect/authorize
  tokenEndpoint: https://login.propertyme.com/connect/token
  userinfoEndpoint: https://login.propertyme.com/connect/userinfo
  jwksUri: https://login.propertyme.com/.well-known/openid-configuration/jwks
  revocationEndpoint: https://login.propertyme.com/connect/revocation
  introspectionEndpoint: https://login.propertyme.com/connect/introspect
  endSessionEndpoint: https://login.propertyme.com/connect/endsession
  deviceAuthorizationEndpoint: https://login.propertyme.com/connect/deviceauthorization
  backchannelAuthenticationEndpoint: https://login.propertyme.com/connect/ciba
  pushedAuthorizationRequestEndpoint: https://login.propertyme.com/connect/par
  requirePushedAuthorizationRequests: false
  pkce:
  - S256
  - plain
  tokenEndpointAuthMethods:
  - client_secret_basic
  - client_secret_post
  idTokenSigningAlgs:
  - RS256
  apiSecurityDefinition: |
    The Swagger document declares exactly one security definition: a "Bearer"
    apiKey carried in the Authorization header. Tokens are minted by the
    IdentityServer above, so the effective scheme is OAuth 2.0 bearer.
  grantTypesAdvertised:
  - authorization_code
  - client_credentials
  - refresh_token
  - implicit
  - password
  - urn:ietf:params:oauth:grant-type:device_code
  - urn:openid:params:grant-type:ciba
  - mcp_customer_switch
  - on_behalf_of
  grantTypeNote: |
    Two non-standard grant types are advertised verbatim in the discovery
    document and are worth recording: "mcp_customer_switch" and "on_behalf_of".
    The former is the only Model Context Protocol-shaped signal found anywhere
    in PropertyMe's public surface — it appears in the identity layer, not in the
    API contract, and no MCP server endpoint, tool list or MCP documentation was
    found. Recorded as observed, not interpreted.
  scopesAdvertisedByDiscovery:
  - openid
  - profile
  - email
  - ids:admin
  - property:read
  - property:write
  - contact:read
  - contact:write
  - activity:read
  - activity:write
  - communication:read
  - communication:write
  - transaction:read
  - transaction:write
  - tenancy:write
  - customer:read
  - customer:write
  - form:write
  - org-portal:api
  - offline_access
  scopesReferencedInTheOpenAPI:
  - activity:read
  - activity:write
  - communication:read
  - contact:read
  - contact:write
  - property:read
  - property:write
  - transaction:read
  - transaction:write
  scopesInTheSampleAppAuthorizeUrl:
  - contact:read
  - property:read
  - communication:read
  - transaction:read
  - offline_access
  scopeNote: |
    The identity server advertises twenty scopes; the published API contract
    only ever names nine of them in its operation descriptions; and the
    first-party sample application requests five read scopes plus
    offline_access. The gap (ids:admin, customer:read, customer:write,
    tenancy:write, form:write, org-portal:api, communication:write) points at
    internal or partner-only surfaces that are not described by the public
    Swagger document. A third-party Python wrapper's documentation states that
    write operations "require additional API scopes that are not typically
    available", which is consistent with, but not proof of, tiered scope
    issuance. Recorded as an observation with its source, not as a PropertyMe
    statement.
  productSecurityControls: |
    From https://www.propertyme.com.au/security (HTTP 200): 256-bit TLS in
    transit and encryption at rest, layered architecture with core systems not
    internet-exposed, optional TOTP two-factor authentication via Google
    Authenticator, automatic logout, automatic 15-minute lockout after three
    failed logins, full activity logging of material data changes, sign-in and
    sensitive-change notification emails, and four granular user access levels
    with remote logout, password reset, 2FA reset and device expiry. No
    certification claim (no SOC 2, ISO 27001 or IRAP statement) appears on that
    page, and https://www.propertyme.com.au/.well-known/security.txt is HTTP 404.

apiFamily:
  segmentationUsedByTheContract: |
    The Swagger document tags every operation twice: once with a coarse
    "Scope: X" group (Activities, Bills, Contacts, Messages, Properties) and
    once with a fine resource tag (Comments, Connection, Contacts, Dashboards,
    Documents, Images, Inspections, JobTasks, Members, Properties, Tasks,
    Tenancies). The eleven entries in apis.yml mirror the fine resource tags,
    merging Comments/Documents/Images into a single file surface because they
    exist only as sub-resources of the other entities. No family was invented.
  listingsSearch: |
    No. There is no market-wide listings search and no public property search.
    GET /v1/lots/sales lists the connected agency's own active sales and
    GET /v1/lots/rentals its own rentals. PropertyMe is not a portal and does
    not syndicate to one through this API.
  propertyRecords: |
    Yes, and it is the core. Lots with detail, images, contact alerts, the
    managing member, and rental / sales / vacancy / archived views, all
    pollable by changed-since timestamp.
  valuationAVM: |
    None. No AVM, no appraisal, no valuation endpoint, and no reference to
    PropTrack or CoreLogic anywhere in the contract. Valuation in this market
    sits with REA Group's PropTrack and with CoreLogic, not with the property
    management vendor.
  transactions: |
    Thin and one-directional. POST /v1/bills creates a bill with its document
    against the trust ledger, and the transactions dashboard reads aggregates.
    There is no payments API, no rent receipting endpoint, no disbursement
    endpoint and no trust reconciliation surface in the public contract, even
    though trust accounting and the MePay payments product are headline
    PropertyMe features.
  documents: |
    Yes, as sub-resources. Documents can be created against contacts, lots,
    owner and tenant folios, inspections, tasks, jobs and job quotations; images
    can be listed for contacts, lots, inspections, tasks and jobs.
  tenancy: |
    Yes — tenancies and tenancy balances, read-only in the public contract, even
    though the identity server advertises a tenancy:write scope that the
    published contract never uses.
  payments: |
    No payments API. MePay is a real PropertyMe product — the site footer
    identifies the operating entity as MePay Holdings Pty Ltd, AFCA member ID
    81095, AFS licence no. 528836 — but no MePay endpoint, webhook or contract is
    published.
  maintenance: |
    The strongest surface. Job tasks exist in both v1 and v2, with quotations,
    supplier assignment, approve/reject/complete/reopen transitions and document
    and image attachment. This is what the third-party integrator ecosystem
    (SyncEzy, Properteasy, ServiceM8, simPRO connectors) is actually built on.
  inspections: |
    Twenty operations covering the complete routine and entry/exit inspection
    lifecycle including reports — unusually deep, and absent from every
    listing-oriented API in this sector.

harvest:
  fetchDate: '2026-07-26'
  openapiHarvested: true
  specsCount: 1
  artifactsSaved:
  - path: openapi/propertyme-openapi.json
    sourceURL: https://app.propertyme.com/api/openapi.json
    httpStatus: 200
    contentType: application/json; charset=utf-8
    bytes: 266274
    format: Swagger 2.0
    parsed: true
    paths: 75
    operations: 86
    definitions: 296
    host: app.propertyme.com
    basePath: /api
    schemes:
    - https
    infoTitle: PropertyMe
    infoVersion: '1.0'
    note: Saved verbatim, byte-for-byte, unmodified. Fetched anonymously with no
      credentials, no cookies and no referer. Validated by json.load and by
      walking every path item.
  - path: authentication/propertyme-openid-configuration.json
    sourceURL: https://login.propertyme.com/.well-known/openid-configuration
    httpStatus: 200
    contentType: application/json; charset=UTF-8
    bytes: 3255
    format: OpenID Connect Discovery 1.0
    parsed: true
    note: Saved verbatim, unmodified. Fetched anonymously.
  howTheSpecWasFound: |
    Not by guessing. The Swagger UI path was named in the documentation of an
    independent Python wrapper (pypropertyme.garyj.dev), which pointed at
    https://app.propertyme.com/api/swagger-ui/. That page returned HTTP 200 with
    the title "PropertyMe APIs" but is an old swagger-ui build whose inline
    JavaScript resolves the spec URL to the Petstore demo when no ?url= is
    supplied, so it discloses no spec location itself. The real document was then
    found at https://app.propertyme.com/api/openapi.json — the conventional
    sibling path — and confirmed by content, not by status code. The API host and
    versioned path were independently corroborated by PropertyMe's own sample
    app: appsettings.json sets PropertyMeApiEndPoint to
    https://app.propertyme.com and AuthorityUrl to https://login.propertyme.com,
    and ContactController.cs calls
    {endpoint}/api/v1/contacts?TimeStamp={timestamp} with a bearer header.
    GET https://app.propertyme.com/api/v1/contacts anonymously returns HTTP 401,
    confirming a live, authenticated production surface.

