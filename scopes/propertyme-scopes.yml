notes: >-
  PropertyMe's Swagger 2.0 document declares only a single apiKey-style `Bearer` security definition,
  so an OpenAPI-only derivation yields zero scopes — the mechanical derive pass found none. The real
  scope surface is published anonymously in two places instead: the `scopes_supported` array of the
  OpenID Connect discovery document at login.propertyme.com, and the prose of every operation
  description in the contract ("The auth token must contain a scope of property:read."). This file
  reconciles both: `scopes[]` is the authoritative advertised list, and `operations` counts how many
  of the 86 published operations actually require each scope. PropertyMe publishes no scope reference
  page — there is no developer portal — so the discovery document IS the reference. Eight advertised
  scopes are never exercised by any published operation; they belong to surfaces PropertyMe has not
  exposed in the public contract (org portal, forms, customer administration, messaging writes).
