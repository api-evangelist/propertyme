notes: 'PropertyMe publishes no hosted MCP server: mcp.propertyme.com and mcp.propertyme.com.au do not
  resolve, app.propertyme.com/mcp returns 404, and no MCP server appears in any public registry. HOWEVER
  the anonymous OpenID Connect discovery document at https://login.propertyme.com/.well-known/openid-configuration
  advertises two non-standard grant types — "mcp_customer_switch" and "on_behalf_of" — alongside the standard
  set. That is direct, first-party evidence that PropertyMe operates an MCP surface behind its identity
  provider (almost certainly bound to the AiMe assistant product), with a grant purpose-built for switching
  the acting customer portfolio mid-session. It is not publicly reachable and no tools/list is anonymously
  introspectable. The tools below are a CANDIDATE set derived one-per-operation from the published Swagger
  2.0 contract, not PropertyMe''s own tool names.'
