    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Search job task based on due date, created date and status
      description: The auth token must contain a scope of activity:read.
      operationId: SearchJobTaskV2Requestjobtaskssearch_Get
      parameters:
      - name: DueDateMin
        in: query
        description: From Due Date (yyyy-MM-dd in UTC)
        required: false
        schema:
          type: string
          format: date-time
      - name: DueDateMax
        in: query
        description: To Due Date (yyyy-MM-dd in UTC). Allowed date range is 10 days
        required: false
        schema:
          type: string
          format: date-time
      - name: DateCreatedMin
        in: query
        description: From Created Date (yyyy-MM-dd in UTC)
        required: false
        schema:
          type: string
          format: date-time
      - name: DateCreatedMax
        in: query
        description: To Created Date (yyyy-MM-dd in UTC). Allowed date range is 10 days
        required: false
        schema:
          type: string
          format: date-time
      - name: Status
        in: query
        description: Job task status
        required: false
        schema:
          type: string
          enum:
          - Pending
          - Reported
          - Quoted
          - Approved
          - Assigned
          - Finished
          - Closed
          - Rejected
          - Completed
          - Cancelled
      - name: Offset
        in: query
        description: The number of rows to skip before beginning to return rows. An offset of 0 is the same as omitting the offset parameter.
        required: true
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        description: The maximum number of results to be returned(Max value is 100). There may be less if the query returned less than the maximum.
        required: true
        schema:
          type: integer
          format: int32
      - name: Priority
        in: query
        description: Job priority
        required: false
        schema:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Urgent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<JobQueryV2Data>
                type: array
                items:
                  $ref: '#/components/schemas/JobQueryV2Data'
