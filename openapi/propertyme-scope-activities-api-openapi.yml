              schema:
                $ref: '#/components/schemas/CustomerMemberData'
        '400':
          description: Invalid task id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerMemberData'
      deprecated: false
      security:
      - Bearer: []
  /v1/jobtasks/{Id}/assign:
    parameters:
    - $ref: '#/components/parameters/Accept'
    post:
      tags:
      - ' Scope: Activities'
      summary: Update the supplier of a job
      description: The auth token must contain a scope of Activity:write.
      operationId: AssignTaskRequestjobtasksIdassign_Post
      parameters:
      - name: Id
        in: path
        description: Id of the job
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
        '400':
          description: Invalid job id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
  /v1/jobtasks/{Id}/comments:
    parameters:
    - $ref: '#/components/parameters/Accept'
    post:
      tags:
      - ' Scope: Activities'
      summary: Create a new comment for a given job
      description: The auth token must contain a scope of activity:write.
      operationId: AddJobCommentRequestjobtasksIdcomments_Post
      parameters:
      - name: Id
        in: path
        description: The id of the job
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
        '500':
