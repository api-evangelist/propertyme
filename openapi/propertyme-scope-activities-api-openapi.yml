openapi: 3.2.0
info:
  title: 'PropertyMe Scope: Activities API'
  version: '1.0'
servers:
- url: https://app.propertyme.com/api
tags:
- name: ' Scope: Activities'
paths:
  /v1/tasks:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: List all tasks changed since a given timestamp
      description: The auth token must contain a scope of activity:read.
      operationId: ChangedTasksRequesttasks_Get
      parameters:
      - name: Timestamp
        in: query
        description: Records returned will have a changed timestamp greater than this value
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<MobTaskQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/MobTaskQueryData'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                title: List<MobTaskQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/MobTaskQueryData'
      deprecated: false
      security:
      - Bearer: []
    post:
      tags:
      - ' Scope: Activities'
      summary: Create a new task
      description: The auth token must contain a scope of activity:write.
      operationId: AddTaskRequesttasks_Post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid task request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: task contact id
  /v1/jobtasks:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: List all job tasks changed since a given timestamp
      description: The auth token must contain a scope of activity:read.
      operationId: ChangedJobTaskRequestjobtasks_Get
      parameters:
      - name: Timestamp
        in: query
        description: Records returned will have a changed timestamp greater than this value
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<MobJobTaskQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/MobJobTaskQueryData'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                title: List<MobJobTaskQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/MobJobTaskQueryData'
        '400':
          description: Invalid timestamp value
          content:
            application/json:
              schema:
                title: List<MobJobTaskQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/MobJobTaskQueryData'
      deprecated: false
      security:
      - Bearer: []
    post:
      tags:
      - ' Scope: Activities'
      summary: Create a new job
      description: The auth token must contain a scope of activity:write.
      operationId: AddJobRequestjobtasks_Post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
        '400':
          description: Invalid job request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: supplier instructions
  /v1/inspections:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: List all inspections changed since a given timestamp
      description: The auth token must contain a scope of activity:read.
      operationId: ChangedInspectionsRequestinspections_Get
      parameters:
      - name: Timestamp
        in: query
        description: Records returned will have a changed timestamp greater than this value
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<ChangedInspectionData>
                type: array
                items:
                  $ref: '#/components/schemas/ChangedInspectionData'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                title: List<ChangedInspectionData>
                type: array
                items:
                  $ref: '#/components/schemas/ChangedInspectionData'
      deprecated: false
      security:
      - Bearer: []
    post:
      tags:
      - ' Scope: Activities'
      summary: Create a new inspection
      description: The auth token must contain a scope of activity:write.
      operationId: AddInspectionRequestinspections_Post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInspectionResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInspectionResponse'
        '400':
          description: Invalid inspection request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInspectionResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: listing id for open inspection
  /v1/tasks/{Id}:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Find a Task by id
      description: The auth token must contain a scope of activity:read.
      operationId: GetTaskRequesttasksId_Get
      parameters:
      - name: Id
        in: query
        description: The id of the task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskQueryData'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskQueryData'
        '400':
          description: Invalid task id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskQueryData'
      deprecated: false
      security:
      - Bearer: []
    post:
      tags:
      - ' Scope: Activities'
      summary: update an existing task
      description: The auth token must contain a scope of activity:write.
      operationId: UpdateTaskRequesttasksId_Post
      parameters:
      - name: Id
        in: path
        description: The id of the task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid task request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: task manager member id
  /v1/jobtasks/{Id}:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Find a job task by id
      description: The auth token must contain a scope of activity:read.
      operationId: JobTaskRequestjobtasksId_Get
      parameters:
      - name: Id
        in: path
        description: Id of the job task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskQueryData'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskQueryData'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskQueryData'
      deprecated: false
      security:
      - Bearer: []
    post:
      tags:
      - ' Scope: Activities'
      summary: Update an existing job
      description: The auth token must contain a scope of activity:write.
      operationId: UpdateJobRequestjobtasksId_Post
      parameters:
      - name: Id
        in: path
        description: Job Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
        '400':
          description: Invalid job request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: supplier instructions
  /v1/jobtasks/search:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Search job task based on due date, created date and status
      description: The auth token must contain a scope of activity:read.
      operationId: SearchJobTaskRequestjobtaskssearch_Get
      parameters:
      - name: DueDateMin
        in: query
        description: From Due Date (yyyy-MM-dd in UTC)
        required: false
        schema:
          type: string
          format: date-time
      - name: DueDateMax
        in: query
        description: To Due Date (yyyy-MM-dd in UTC). Allowed date range is 10 days
        required: false
        schema:
          type: string
          format: date-time
      - name: DateCreatedMin
        in: query
        description: From Created Date (yyyy-MM-dd in UTC)
        required: false
        schema:
          type: string
          format: date-time
      - name: DateCreatedMax
        in: query
        description: To Created Date (yyyy-MM-dd in UTC). Allowed date range is 10 days
        required: false
        schema:
          type: string
          format: date-time
      - name: Status
        in: query
        description: Job task status
        required: false
        schema:
          type: string
      - name: Offset
        in: query
        description: The number of rows to skip before beginning to return rows. An offset of 0 is the same as omitting the offset parameter.
        required: true
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        description: The maximum number of results to be returned(Max value is 100). There may be less if the query returned less than the maximum.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<JobQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/JobQueryData'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                title: List<JobQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/JobQueryData'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                title: List<JobQueryData>
                type: array
                items:
                  $ref: '#/components/schemas/JobQueryData'
      deprecated: false
      security:
      - Bearer: []
  /v1/inspections/{id}:
    parameters:
    - $ref: '#/components/parameters/Accept'
    post:
      tags:
      - ' Scope: Activities'
      summary: Update an existing inspection
      description: The auth token must contain a scope of activity:write.
      operationId: UpdateInspectionRequestinspectionsid_Post
      parameters:
      - name: Id
        in: path
        description: Inspection Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInspectionResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInspectionResponse'
        '400':
          description: Invalid inspection request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInspectionResponse'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: listing id for open inspection
    delete:
      tags:
      - ' Scope: Activities'
      summary: Delete the inspection
      description: The auth token must contain a scope of activity:write.
      operationId: DeleteInspectionRequestinspectionsid_Delete
      parameters:
      - name: Id
        in: path
        description: Inspection Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
        '400':
          description: Invalid inspection request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
      deprecated: false
      security:
      - Bearer: []
  /v1/inspections/{Id}:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Find an inspection by id
      description: The auth token must contain a scope of activity:read.
      operationId: GetInspectionRequestinspectionsId_Get
      parameters:
      - name: Id
        in: query
        description: Inspection Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInspectionResponse'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInspectionResponse'
        '400':
          description: Invalid inspection id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInspectionResponse'
      deprecated: false
      security:
      - Bearer: []
  /v1/inspections/search:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Search all inspections by contact id and/or lot id
      description: The auth token must contain a scope of activity:read.
      operationId: SearchInspectionsRequestinspectionssearch_Get
      parameters:
      - name: ContactId
        in: query
        description: Id of the contact
        required: false
        schema:
          type: string
      - name: LotId
        in: query
        description: Id of the property
        required: false
        schema:
          type: string
      - name: Offset
        in: query
        description: The number of rows to skip before beginning to return rows. An offset of 0 is the same as omitting the offset parameter.
        required: true
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        description: The maximum number of results to be returned. There may be less if the query returned less than the maximum.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<InspectionTask>
                type: array
                items:
                  $ref: '#/components/schemas/InspectionTask'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                title: List<InspectionTask>
                type: array
                items:
                  $ref: '#/components/schemas/InspectionTask'
        '400':
          description: Invalid contact and/or lot id(s)
          content:
            application/json:
              schema:
                title: List<InspectionTask>
                type: array
                items:
                  $ref: '#/components/schemas/InspectionTask'
      deprecated: false
      security:
      - Bearer: []
  /v1/inspections/query:
    parameters:
    - $ref: '#/components/parameters/Accept'
    get:
      tags:
      - ' Scope: Activities'
      summary: Query all inspections
      description: The auth token must contain a scope of activity:read.
      operationId: QueryInspectionRequestinspectionsquery_Get
      parameters:
      - name: DueDateMin
        in: query
        description: From Due Date (yyyy-MM-dd)
        required: false
        schema:
          type: string
          format: date-time
      - name: DueDateMax
        in: query
        description: To Due Date (yyyy-MM-dd)
        required: false
        schema:
          type: string
          format: date-time
      - name: Type
        in: query
        description: Inspection type can be one of Routine, Entry, Exit and Open
        required: false
        schema:
          type: string
      - name: Status
        in: query
        description: Inspection task status. Can be one of Planned, Scheduled, ReScheduled, Inspected, Closed, Cancelled
        required: false
        schema:
          type: string
      - name: Published
        in: query
        description: Inspection is published. Can be Yes, No, empty
        required: false
        schema:
          type: string
      - name: MemberOrTeam
        in: query
        description: Inspection property member or team Id(Guid)
        required: false
        schema:
          type: string
      - name: TaskMemberOrTeam
        in: query
        description: Inspection task member or team Id(Guid)
        required: false
        schema:
          type: string
      - name: Label
        in: query
        description: Inspection task label
        required: false
        schema:
          type: string
      - name: Offset
        in: query
        description: The number of rows to skip before beginning to return rows. An offset of 0 is the same as omitting the offset parameter.
        required: true
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        description: The maximum number of results to be returned. There may be less if the query returned less than the maximum.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                title: List<InspectionDataTableRow>
                type: array
                items:
                  $ref: '#/components/schemas/InspectionDataTableRow'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                title: List<InspectionDataTableRow>
                type: array
                items:
                  $ref: '#/components/schemas/InspectionDataTableRow'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                title: List<InspectionDataTableRow>
                type: array
                items:
                  $ref: '#/components/schemas/InspectionDataTableRow'
      deprecated: false
      security:
      - Bearer: []
  /v1/tasks/{Id}/comments:
    parameters:
    - $ref: '#/components/parameters/Accept'
    post:
      tags:
      - ' Scope: Activities'
      summary: Create a new comment for a given task
      description: The auth token must contain a scope of activity:write.
      operationId: AddTaskCommentRequesttasksIdcomments_Post
      parameters:
      - name: Id
        in: path
        description: The id of the task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
        '500':
          description: An internal error has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
        '400':
          description: Invalid task id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
      deprecated: false
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema: {}
        description: comment
  /v1/tasks/{Id}/documents:
    parameters:
    - $ref: '#/components/parameters/Accept'
    post:
      tags:
      - ' Scope: Activities'
      summary: Create a new document for a given task
      description: The auth token must contain a scope of Activity:write.
      operationId: AddTaskDocumentRequesttasksIddocuments_Post
      parameters:
      - name: Id
        in: path
        description: Id of the task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'
        '500':
