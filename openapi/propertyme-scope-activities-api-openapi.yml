            application/json:
              schema:
                title: List<JobQueryV2Data>
                type: array
                items:
                  $ref: '#/components/schemas/JobQueryV2Data'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                title: List<JobQueryV2Data>
                type: array
                items:
                  $ref: '#/components/schemas/JobQueryV2Data'
      deprecated: false
      security:
      - Bearer: []
