  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-dashboards-api
  name: PropertyMe Dashboards API
  description: Typed dashboard aggregates over a connected portfolio — activities, communications,
    lots and transactions, each retrieved by dashboard item type. The read model behind the PropertyMe
    dashboard, drawing on the activity, communication, property and transaction read scopes.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Dashboards
  - Reporting
  - Analytics
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-documents-and-images-api
  name: PropertyMe Documents and Images API
  description: The file surface, exposed as sub-resources rather than a standalone collection — create
    documents against contacts, lots, owner and tenant folios, inspections, tasks and jobs, and list
    images for contacts, lots, inspections, tasks and jobs. Document creation is governed by the
    write scope of the parent resource.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Documents
  - Image
  - File
  tags_raw:
  - Documents
  - Images
  - Files
