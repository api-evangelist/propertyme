  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-bills-api
  name: PropertyMe Bills API
  description: Create a new bill in a connected PropertyMe portfolio, including the supporting document,
    against the trust accounting ledger. This is the only transaction-writing operation exposed in
    the published contract and it requires the transaction:write scope.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Bills
  - Trust Accounting
  - Transaction
  tags_raw:
