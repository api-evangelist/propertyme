  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-members-api
  name: PropertyMe Members API
  description: The agency staff directory inside a connected portfolio — list all members, and resolve
    the responsible member for a lot, a task, a job or an inspection. Requires the contact:read scope.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Members
  - Property Managers
  - Staff
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-portfolio-connection-api
  name: PropertyMe Portfolio Connection API
  description: The consent seam. A single DELETE /v1/portfolios/disconnect operation severs the integration's
    connection to the customer's current portfolio. Every other operation in the API is implicitly
    scoped to the one portfolio the agency connected, which is what makes this a per-customer, revocable
    integration rather than market-wide data access.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Connection
  - Portfolio
  - Consent
  tags_raw:
  - Connection
