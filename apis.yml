aid: propertyme
url: https://raw.githubusercontent.com/api-evangelist/propertyme/refs/heads/main/apis.yml
name: PropertyMe
kind: company
description: PropertyMe is an Australian cloud property management and trust accounting platform
  for residential real estate agencies, founded in 2013 and operated by MePay Holdings Pty Ltd (AFCA
  member ID 81095, AFS licence no. 528836), with roughly 1.7 million properties under management
  across Australia and New Zealand. In the Australian property value chain it sits on the PROPERTY
  MANAGEMENT rail rather than the listing or settlement rails — it does not operate a portal like
  REA Group's realestate.com.au or Domain, and it is not a PEXA conveyancing participant; it is the
  system of record for the rental portfolio, holding lots, tenancies, owners, tenants, suppliers,
  trust transactions, inspections, maintenance jobs and documents, plus its own MePay payments product
  and the Grow CRM and AiMe assistant products. Its API posture is unusually honest for this sector
  — the machine-readable contract is genuinely open while the credentials are not. A Swagger 2.0
  document describing 75 paths, 86 operations and 296 definitions is served anonymously with no login
  at https://app.propertyme.com/api/openapi.json, rendered by a public Swagger UI at https://app.propertyme.com/api/swagger-ui/,
  and the OpenID Connect discovery document at https://login.propertyme.com is also served anonymously
  and advertises the full scope list. But no self-serve developer signup, app registration route
  or public client-credential issuance path exists anywhere on propertyme.com.au, app.propertyme.com
  or any developer/developers/docs/api subdomain (none of which resolve); a developer must approach
  PropertyMe to be issued an OAuth client_id and client_secret, and every call is additionally scoped
  to one customer's portfolio that the agency itself connects and can disconnect. RESO is absent
  — PropertyMe does not appear in the RESO certification directory, there is no OData service, no
  $metadata document and no Universal Property Identifier, which is the expected Australian answer
  because RESO is a North American NAR/MLS construct with no Australian counterpart. PropertyMe publishes
  no open data.
