apis:
- aid: propertyme:propertyme-contacts-api
  name: PropertyMe Contacts API
  description: Read the contact records in a connected PropertyMe portfolio — owners, tenants, suppliers
    and the agency contact itself — with change-since-timestamp polling, contact alerts by type,
    images, and write access for comments and documents attached to a contact. Requires the contact:read
    scope; comment and document creation require contact:write.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Contacts
  - Owners
  - Tenants
  - Suppliers
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-properties-api
  name: PropertyMe Properties API
  description: The lot (property) record in a connected PropertyMe portfolio — list all lots changed
    since a timestamp, or filter to rentals, active sales, vacancies and archived lots, retrieve
    lot detail, contact alerts, images and the managing member, and attach comments and documents
    to a lot or to an owner or tenant folio. Requires the property:read scope; writes require property:write.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Properties
  - Lots
  - Rentals
  - Vacancy
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-tenancies-api
  name: PropertyMe Tenancies API
  description: Read-only access to the tenancies in a connected PropertyMe portfolio and to tenancy
    balances, including a single tenancy balance record by id. This is the lettings ledger surface
    that most listing-oriented real estate APIs omit entirely. Requires the property:read scope.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Tenancies
  - Leases
  - Balances
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-inspections-api
  name: PropertyMe Inspections API
  description: The full routine and entry/exit inspection lifecycle — create, query, search by contact
    or lot, filter by status, and drive an inspection through schedule, reschedule, inspect, close
    and reopen transitions, plus inspection reports, comments, documents, images and the assigned
    inspection manager. Requires activity:read and, for the state transitions, activity:write.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Inspections
  - Reports
  - Compliance
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-job-tasks-api
  name: PropertyMe Job Tasks API
  description: Maintenance work orders, in both a v1 and a newer v2 shape. Create and update jobs,
    search by due date, created date and status, move a job through approve, assign, complete, reject
    and reopen, manage supplier quotations and quotation documents, and attach comments, documents
    and images. The largest write surface in the API. Requires activity:read and activity:write.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Maintenance
  - Job
  - Work Orders
  - Quotations
  - Suppliers
  tags_raw:
  - Maintenance
  - Jobs
  - Work Orders
  - Quotations
  - Suppliers
  properties:
  - type: OpenAPI
    url: openapi/propertyme-openapi.json
  - type: APIReference
    url: https://app.propertyme.com/api/swagger-ui/
  - type: Authentication
    url: authentication/propertyme-openid-configuration.json
- aid: propertyme:propertyme-tasks-api
  name: PropertyMe Tasks API
  description: General property management tasks distinct from maintenance jobs — list tasks changed
    since a timestamp, create and update a task, find a task by id, read the assigned task manager,
    and attach comments, documents and images. Requires activity:read and activity:write.
  humanURL: https://app.propertyme.com/api/swagger-ui/
  baseURL: https://app.propertyme.com/api
  tags:
  - Task
  - Workflows
  tags_raw:
  - Tasks
