source: npm, PyPI, NuGet, RubyGems, Packagist, crates.io, pkg.go.dev, github.com/PropertyMe
notes: >-
  PropertyMe ships NO first-party client SDK for its API in any language. Every public registry was
  searched: npm returns zero results for "propertyme"; PyPI 404s on propertyme, pypropertyme,
  property-me and propertyme-api; RubyGems, Packagist and crates.io return nothing relevant. NuGet has
  exactly one package authored by PropertyMe — PropertyMe.MassTransit.MySqlOutbox — but that is an
  internal messaging-infrastructure library (a MassTransit transactional outbox for MySQL), not an API
  client, so it does NOT constitute an SDK for the PropertyMe API and this repo deliberately does not
  claim an SDKs pointer on the strength of it. The github.com/PropertyMe organisation holds seven
  public repositories, six of which are forks of third-party .NET libraries (ServiceStack.Text,
  ServiceStack.OrmLite, IdentityServer4, Kavita) or internal infrastructure. The one thing that IS
  first-party and API-facing is HelloPropertyMe.NET, a sample application demonstrating the OAuth 2.0
  connection — sample code, not a library. The only client library that exists is third-party:
  PyPropertyMe, a Python wrapper generated from PropertyMe's own OpenAPI document with Microsoft
  Kiota, published as documentation at pypropertyme.garyj.dev and not distributed on PyPI.
first_party_sdk: false
